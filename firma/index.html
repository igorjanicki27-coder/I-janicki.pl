<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="theme-color" content="#07111a" />
  <title>Firma — logowanie</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="../icons/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;700&display=swap"
    />
  </noscript>
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <div class="page-shell">
    <div class="page-bg" aria-hidden="true">
      <div class="page-glow page-glow-a"></div>
      <div class="page-glow page-glow-b"></div>
      <div class="page-grid"></div>
    </div>

    <main class="login-screen">
      <div class="login-card">
        <div class="login-header">
          <div class="login-brand">
            <span class="brand-mark">FIRMA</span>
            <span class="brand-sub">zarządzanie klientami</span>
          </div>
          <div class="login-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              <circle cx="12" cy="16" r="1" />
            </svg>
          </div>
        </div>

        <form id="loginForm" class="login-form">
          <label class="login-label" for="pinInput">Wprowadź PIN</label>
          <div class="pin-input-wrap">
            <input
              type="password"
              id="pinInput"
              class="pin-input"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              placeholder="····"
              autocomplete="off"
              autofocus
            />
          </div>
          <button type="submit" class="login-button">
            Zaloguj się
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>
        </form>

        <p class="login-hint">Tryb emulacji — wprowadź dowolny PIN, aby przejść dalej.</p>
      </div>
    </main>
  </div>

  <script type="module">
    const form = document.getElementById('loginForm');
    const input = document.getElementById('pinInput');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const pin = input.value.trim();

      if (!pin || pin.length < 1) {
        input.classList.add('pin-error');
        input.placeholder = 'Wprowadź PIN';
        setTimeout(() => {
          input.classList.remove('pin-error');
          input.placeholder = '····';
        }, 1500);
        return;
      }

      // Emulacja — każdy PIN jest akceptowany
      sessionStorage.setItem('ijanicki_firma_loggedIn', 'true');
      // Zawsze zaczynaj od listy firm, nie wchodź do poprzednio wybranej
      sessionStorage.removeItem('ijanicki_firma_activeFirm');
      sessionStorage.removeItem('ijanicki_firma_activeMonth');
      window.location.href = 'przeglad.html';
    });

    // Jeśli już zalogowany — pokaż panel zamiast logowania
    if (sessionStorage.getItem('ijanicki_firma_loggedIn') === 'true') {
      document.getElementById('loginForm').style.display = 'none';
      document.querySelector('.login-hint').style.display = 'none';
      const loggedInBox = document.createElement('div');
      loggedInBox.className = 'logged-in-box';
      loggedInBox.innerHTML = `
        <p style="margin:0 0 16px;color:#94a3b8;font-size:15px;">Jesteś zalogowany</p>
        <button class="login-button" onclick="sessionStorage.removeItem('ijanicki_firma_activeFirm');sessionStorage.removeItem('ijanicki_firma_activeMonth');window.location.href='przeglad.html'">
          Przejdź do firm
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
        <button class="logout-button" onclick="sessionStorage.removeItem('ijanicki_firma_loggedIn');window.location.reload()" style="margin-top:12px;background:none;border:1px solid #334155;color:#94a3b8;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px;">
          Wyloguj się
        </button>
      `;
      document.querySelector('.login-card').appendChild(loggedInBox);
    }
  </script>
</body>
</html>
