<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Firma – zmiana PIN</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #061019; color: #ebf4fb;
      font-family: Inter, system-ui, sans-serif;
    }
    .card {
      background: rgba(10,22,32,0.9);
      border: 1px solid rgba(132,160,182,0.18);
      border-radius: 18px; padding: 40px; max-width: 480px;
      width: 100%; box-sizing: border-box;
    }
    .card h2 { margin: 0 0 8px; font-size: 1.4rem; }
    .card .sub { margin: 0 0 24px; line-height: 1.6; color: #b0c9db; font-size: 0.9rem; }
    .step { display: none; }
    .step.active { display: block; }
    .step h3 { margin: 0 0 16px; font-size: 1rem; color: #b0c9db; }
    label { display: block; text-align: left; font-size: 0.85rem; color: #b0c9db; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; max-width: 260px; box-sizing: border-box;
      padding: 14px 18px; border: 1px solid rgba(132,160,182,0.3);
      border-radius: 12px; background: rgba(255,255,255,0.06);
      color: #ebf4fb; font-size: 1.2rem; text-align: center;
      letter-spacing: 4px; outline: none;
    }
    input[type="password"]:focus {
      border-color: #61e5c2; box-shadow: 0 0 0 2px rgba(97,229,194,0.2);
    }
    button {
      padding: 14px 32px; border: 0; border-radius: 12px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
      background: linear-gradient(135deg, #61e5c2 0%, #8df1b8 100%);
      color: #06221d; margin-top: 12px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost {
      background: transparent; border: 1px solid rgba(132,160,182,0.3);
      color: #ebf4fb; margin-left: 8px;
    }
    .msg { margin-top: 12px; font-size: 0.85rem; line-height: 1.6; min-height: 1.6em; }
    .msg.ok { color: #61e5c2; }
    .msg.err { color: #f46f81; }
    .msg.wait { color: #b0c9db; }
    code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    .button-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 Zmiana PIN</h2>
    <p class="sub">Proces składa się z dwóch kroków: najpierw podaj obecny PIN, a następnie ustaw nowy.</p>

    <!-- Krok 1: weryfikacja starego PIN-u -->
    <div class="step active" id="step1">
      <h3>Krok 1 z 2 — weryfikacja</h3>
      <label for="oldPin">Obecny PIN</label>
      <input type="password" id="oldPin" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="••••" autocomplete="off" />
      <div class="button-row">
        <button id="verifyBtn" disabled>Zweryfikuj PIN</button>
      </div>
      <div id="msg1" class="msg"></div>
    </div>

    <!-- Krok 2: ustawienie nowego PIN-u (widoczny dopiero po weryfikacji) -->
    <div class="step" id="step2">
      <h3>Krok 2 z 2 — nowy PIN</h3>
      <label for="newPin">Nowy PIN (4–10 cyfr)</label>
      <input type="password" id="newPin" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="••••" autocomplete="off" />
      <label for="confirmPin" style="margin-top:12px;">Potwierdź nowy PIN</label>
      <input type="password" id="confirmPin" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="••••" autocomplete="off" />
      <div class="button-row">
        <button class="ghost" id="backBtn">← Cofnij</button>
        <button id="changeBtn" disabled>Zmień PIN</button>
      </div>
      <div id="msg2" class="msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    /* ── Firebase config ─────────────────────────────────── */
    const firebaseConfig = {
      apiKey: 'AIzaSyDnBGZh-HSHx2gqFm78S7p86coHk25u0xc',
      authDomain: 'i-janicki.firebaseapp.com',
      projectId: 'i-janicki',
      storageBucket: 'i-janicki.firebasestorage.app',
      messagingSenderId: '745361888690',
      appId: '1:745361888690:web:1af2df4ddf8fe7b4d600ab'
    };

    const app = getApps()[0] ?? initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const settingsRef = doc(db, 'firmy_settings', 'auth');

    /* ── Pomocnicze SHA-256 ────────────────────────────── */
    async function hashPin(pin, salt) {
      const msg = new TextEncoder().encode(pin + ':' + salt);
      const buf = await crypto.subtle.digest('SHA-256', msg);
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }

    /* ── Stan weryfikacji ─────────────────────────────── */
    let verified = false;        // czy krok 1 zaliczony
    let cachedSalt = null;       // sól z Firestore
    let cachedHash = null;       // obecny hash z Firestore

    /* ── Referencje DOM ───────────────────────────────── */
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const oldPin = document.getElementById('oldPin');
    const newPin = document.getElementById('newPin');
    const confirmPin = document.getElementById('confirmPin');
    const verifyBtn = document.getElementById('verifyBtn');
    const changeBtn = document.getElementById('changeBtn');
    const backBtn = document.getElementById('backBtn');
    const msg1 = document.getElementById('msg1');
    const msg2 = document.getElementById('msg2');

    function showMsg(el, type, text) {
      el.className = 'msg ' + type;
      el.textContent = text;
    }

    function clearMsg(el) {
      el.className = 'msg';
      el.textContent = '';
    }

    /* ── Łączenie z Firebase przy starcie ─────────────── */
    (async function init() {
      showMsg(msg1, 'wait', '⌛ Łączenie z Firebase...');
      try {
        await new Promise((resolve, reject) => {
          if (auth.currentUser) return resolve(auth.currentUser);
          const unsubscribe = onAuthStateChanged(auth, (user) => {
            unsubscribe();
            if (user) return resolve(user);
            signInAnonymously(auth)
              .then((cred) => resolve(cred.user))
              .catch(reject);
          });
        });
        clearMsg(msg1);
      } catch (err) {
        showMsg(msg1, 'err', '❌ Błąd logowania do Firebase: ' + err.message);
        verifyBtn.disabled = true;
      }
    })();

    /* ── Walidacja starego PIN ───────────────────────── */
    oldPin.addEventListener('input', () => {
      verifyBtn.disabled = oldPin.value.trim().length < 1;
    });
    oldPin.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !verifyBtn.disabled) verifyBtn.click();
    });

    verifyBtn.addEventListener('click', async () => {
      const pin = oldPin.value.trim();
      if (!pin) {
        showMsg(msg1, 'err', 'Wpisz obecny PIN.');
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = '⏳ Sprawdzanie...';
      showMsg(msg1, 'wait', 'Weryfikacja...');

      try {
        // Pobierz dane z Firestore (nowa ścieżka, fallback do starej)
        let snap = await getDoc(settingsRef);
        if (!snap.exists() || !snap.data().pinHash) {
          const oldRef = doc(db, 'firmy_settings', 'default');
          snap = await getDoc(oldRef);
        }
        if (!snap.exists()) throw new Error('Brak dokumentu firmy_settings/auth ani firmy_settings/default');
        const data = snap.data();

        if (!data.pinHash || !data.pinSalt) {
          throw new Error('Brak pinHash lub pinSalt w Firestore.');
        }

        cachedSalt = data.pinSalt;
        cachedHash = data.pinHash;

        // Haszuj wpisany PIN i porównaj
        const enteredHash = await hashPin(pin, cachedSalt);

        if (enteredHash !== cachedHash) {
          showMsg(msg1, 'err', '❌ Nieprawidłowy PIN.');
          verifyBtn.textContent = 'Zweryfikuj PIN';
          verifyBtn.disabled = false;
          return;
        }

        // Sukces – przejście do kroku 2
        verified = true;
        clearMsg(msg1);
        step1.classList.remove('active');
        step2.classList.add('active');
        newPin.focus();
      } catch (err) {
        showMsg(msg1, 'err', '❌ Błąd: ' + err.message);
        verifyBtn.textContent = 'Zweryfikuj PIN';
        verifyBtn.disabled = false;
      }
    });

    /* ── Powrót do kroku 1 ───────────────────────────── */
    backBtn.addEventListener('click', () => {
      verified = false;
      step2.classList.remove('active');
      step1.classList.add('active');
      clearMsg(msg2);
      oldPin.value = '';
      changeBtn.disabled = true;
      changeBtn.textContent = 'Zmień PIN';
      oldPin.focus();
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'Zweryfikuj PIN';
    });

    /* ── Walidacja nowego PIN ────────────────────────── */
    function validateNewPin() {
      const p1 = newPin.value.trim();
      const p2 = confirmPin.value.trim();
      if (p1.length < 4 || p2.length < 4) {
        changeBtn.disabled = true;
        return;
      }
      if (p1 !== p2) {
        changeBtn.disabled = true;
        return;
      }
      changeBtn.disabled = false;
    }

    newPin.addEventListener('input', validateNewPin);
    confirmPin.addEventListener('input', validateNewPin);

    newPin.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !changeBtn.disabled) changeBtn.click();
    });
    confirmPin.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !changeBtn.disabled) changeBtn.click();
    });

    /* ── Zmiana PIN ──────────────────────────────────── */
    changeBtn.addEventListener('click', async () => {
      const p1 = newPin.value.trim();
      const p2 = confirmPin.value.trim();

      if (p1.length < 4) {
        showMsg(msg2, 'err', 'Nowy PIN musi mieć co najmniej 4 znaki.');
        return;
      }
      if (p1 !== p2) {
        showMsg(msg2, 'err', 'PIN-y nie są zgodne.');
        return;
      }
      if (!verified || !cachedSalt) {
        showMsg(msg2, 'err', 'Sesja wygasła – zacznij od nowa.');
        return;
      }

      changeBtn.disabled = true;
      changeBtn.textContent = '⏳ Zapisywanie...';
      clearMsg(msg2);

      try {
        // Oblicz hash nowego PIN-u (używamy tej samej soli)
        const newHash = await hashPin(p1, cachedSalt);

        // Migruj wszystkie ustawienia do nowej ścieżki + zapisz nowy hash
        const snap = await getDoc(settingsRef);
        const existing = snap.exists() ? snap.data() : {};
        await setDoc(settingsRef, {
          pinHash: newHash,
          pinSalt: existing.pinSalt || cachedSalt,
          maxAttempts: existing.maxAttempts ?? 3,
          lockMinutes: existing.lockMinutes ?? 10
        });

        showMsg(msg2, 'ok', '✅ PIN został zmieniony pomyślnie.');
        changeBtn.textContent = '✓ Gotowe';
        newPin.value = '';
        confirmPin.value = '';
      } catch (err) {
        showMsg(msg2, 'err', '❌ Błąd zapisu: ' + err.message);
        changeBtn.textContent = 'Zmień PIN';
        changeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
