<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Firma – konfiguracja Firestore</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #061019; color: #ebf4fb;
      font-family: Inter, system-ui, sans-serif;
    }
    .card {
      background: rgba(10,22,32,0.9);
      border: 1px solid rgba(132,160,182,0.18);
      border-radius: 18px; padding: 40px; max-width: 480px;
      text-align: center;
    }
    button {
      padding: 14px 32px; border: 0; border-radius: 12px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
      background: linear-gradient(135deg, #61e5c2 0%, #8df1b8 100%);
      color: #06221d; margin-top: 16px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 0.85rem; line-height: 1.6; }
    .msg.ok { color: #61e5c2; }
    .msg.err { color: #f46f81; }
    code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚙️ Seed Firestore</h2>
    <p style="color:#8ea6bc;font-size:0.9rem;">
      Ta strona tworzy dokument <code>firmy_settings/default</code><br>
      z hashem PIN-u i ustawieniami blokady.<br>
      <strong>Uruchom tylko raz.</strong>
    </p>
    <button id="seedBtn">Zapisz konfigurację</button>
    <div class="msg" id="msg"></div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyDnBGZh-HSHx2gqFm78S7p86coHk25u0xc',
      authDomain: 'i-janicki.firebaseapp.com',
      projectId: 'i-janicki',
      storageBucket: 'i-janicki.firebasestorage.app',
      messagingSenderId: '745361888690',
      appId: '1:745361888690:web:1af2df4ddf8fe7b4d600ab'
    };

    const app = getApps()[0] ?? initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_PIN = '151100';

    const SETTINGS = {
      pinHash: 'a127c2c26917f33e451e62fe0c80bc4c8ed0152e0bdf09ed47140df966840821',
      pinSalt: '4e9657649578439d8c23bcea2a0ebc6b',
      maxAttempts: 3,
      lockMinutes: 10
    };

    const btn = document.getElementById('seedBtn');
    const msg = document.getElementById('msg');

    function show(msgText, ok) {
      msg.textContent = msgText;
      msg.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Łączę z Firebase…';
      show('');

      try {
        // 1. Anonymous auth
        const cred = await signInAnonymously(auth);
        const uid = cred.user.uid;

        btn.textContent = 'Tworzę sesję admina…';

        // 2. Create admin session (pin 151100 – hardcoded admin in rules)
        await setDoc(doc(db, 'firmy_sessions', uid), {
          uid,
          pin: ADMIN_PIN,
          role: 'admin',
          clientId: '',
          clientSlug: '',
          lastLoginAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        btn.textContent = 'Zapisuję ustawienia…';

        // 3. Create settings
        await setDoc(doc(db, 'firmy_settings', 'default'), SETTINGS);

        show('✅ Gotowe! Dokument firmy_settings/default zapisany. Możesz usunąć tę stronę.', true);
        btn.style.display = 'none';
      } catch (err) {
        console.error(err);
        show('❌ Błąd: ' + (err.message || err), false);
        btn.disabled = false;
        btn.textContent = 'Spróbuj ponownie';
      }
    });
  </script>
</body>
</html>
