name: Clean up technical data after 90 days

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Count expired records without deleting them'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-technical-data
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test technical data retention
        run: npm run test:technical-retention
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          FIREBASE_PROJECT_ID: i-janicki
        run: node scripts/prepare-firebase-credentials.mjs
      - name: Remove expired technical data
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run cleanup:technical-data -- --dry-run
          else
            npm run cleanup:technical-data -- --delete
          fi
