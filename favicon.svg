<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B7CFF"/>
      <stop offset="0.52" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#FF2EDB"/>
