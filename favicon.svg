    <rect x="20" y="21" width="24" height="20" rx="7" stroke="url(#neon)" stroke-width="1.3" opacity="0.45"/>

    <circle cx="26" cy="31" r="2.2" fill="url(#neon)"/>
    <circle cx="38" cy="31" r="2.2" fill="url(#neon)"/>

    <path d="M26 36.5C28.5 39 35.5 39 38 36.5"
