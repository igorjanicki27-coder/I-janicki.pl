appId: pl.i-janicki.desktop
productName: i-JANEK
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/
    to: resources
  - from: build/iJanekCert.cer
    to: resources/certs/iJanekCert.cer
  - from: build/icon.png
    to: resources/icon.png
  - from: build/icon.ico
    to: resources/icon.ico
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  icon: build/icon.ico
publish:
  provider: github
  owner: igorjanicki27-coder
  repo: I-janicki.pl
  private: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: i-JANEK-Setup-${version}.${ext}
  include: build/installer.nsh
