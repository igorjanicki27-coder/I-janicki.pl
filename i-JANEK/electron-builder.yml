appId: pl.i-janicki.desktop
productName: i-JANEK
generateUpdatesFilesForAllChannels: true
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/
    to: resources
    filter:
      - '**/*'
      - '!google-oauth-desktop.local.json'
      - '!rustdesk-config.local.txt'
  - from: build/icon.png
    to: resources/icon.png
  - from: build/icon.ico
    to: resources/icon.ico
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  icon: build/icon.ico
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  artifactName: i-JANEK-${version}-${arch}.${ext}
publish:
  provider: github
  owner: igorjanicki27-coder
  repo: I-janicki.pl
  private: false
nsis:
  oneClick: false
  runAfterFinish: true
  allowToChangeInstallationDirectory: true
  artifactName: i-JANEK-Setup-${version}.${ext}
  include: build/installer.nsh
dmg:
  title: i-JANEK ${version}
