extends: ./electron-builder.yml
extraResources:
  - from: resources/
    to: resources
    filter:
      - '**/*'
      - '!rustdesk-config.local.txt'
      - '!macos-signing-public.json'
      - '!update-signing-private.pem'
  - from: build/icon.png
    to: resources/icon.png
  - from: build/icon.ico
    to: resources/icon.ico
