<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wyszukiwarka aut | Autokomis Nowa Era</title>
    <meta
      name="description"
      content="Wyszukiwarka aut używanych z filtrami i sortowaniem ofert."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-shell glass">
        <a class="logo" href="./index.html" aria-label="Autokomis Nowa Era">
          <span class="logo-mark">A</span>
          <span>
            <strong>Autokomis</strong>
            <small>Nowa Era</small>
          </span>
        </a>

        <nav class="site-nav" aria-label="Główna nawigacja">
          <a href="./index.html">Start</a>
          <a href="./index.html#oferty">Mini marketplace</a>
          <a href="./wyszukiwarka.html" class="active">Wyszukiwarka</a>
          <a href="./index.html#skup">Skup aut</a>
          <a href="./index.html#kontakt">Kontakt</a>
        </nav>

        <a class="nav-cta" href="./index.html#skup">Wyceń auto</a>
      </div>
    </header>

    <main class="search-page">
      <section class="search-hero section-reveal">
        <div class="container search-hero-shell">
          <div>
            <p class="section-label">Osobna podstrona</p>
            <h1>Wyszukiwarka samochodów</h1>
            <p>
              Filtruj oferty po marce, paliwie, skrzyni, roczniku i cenie.
              Szybko przechodzisz od przeglądania do konkretnej decyzji.
            </p>
          </div>
          <img src="./assets/hero-board.png" alt="Detale samochodów" />
        </div>
      </section>

      <section class="section section-reveal">
        <div class="container">
          <div class="section-head">
            <div>
              <p class="section-label">Oferty</p>
              <h2>Dostępne samochody</h2>
            </div>
            <p class="search-meta" id="result-count">Ładowanie ofert...</p>
          </div>

          <section class="search-shell glass" aria-label="Filtry ofert">
            <div class="filter-grid">
              <label>
                Marka
                <select id="brand">
                  <option value="">Dowolna</option>
                </select>
              </label>

              <label>
                Paliwo
                <select id="fuel">
                  <option value="">Dowolne</option>
                  <option value="Benzyna">Benzyna</option>
                  <option value="Diesel">Diesel</option>
                  <option value="Hybrid">Hybrid</option>
                </select>
              </label>

              <label>
                Skrzynia
                <select id="gearbox">
                  <option value="">Dowolna</option>
                  <option value="Automat">Automat</option>
                  <option value="Manual">Manual</option>
                </select>
              </label>

              <label>
                Rocznik od
                <input id="year-min" type="number" min="2005" max="2026" placeholder="np. 2019" />
              </label>

              <label>
                Cena do (zł)
                <input id="price-max" type="number" min="15000" step="1000" placeholder="np. 100000" />
              </label>

              <label>
                Szukaj po nazwie
                <input id="query" type="text" placeholder="np. Passat" />
              </label>

              <label>
                Sortowanie
                <select id="sort">
                  <option value="newest">Najnowsze roczniki</option>
                  <option value="price-asc">Cena rosnąco</option>
                  <option value="price-desc">Cena malejąco</option>
                  <option value="mileage-asc">Najmniejszy przebieg</option>
                </select>
              </label>

              <button id="clear-filters" class="btn btn-secondary" type="button">Wyczyść filtry</button>
            </div>
          </section>

          <section class="search-results" id="results-grid" aria-live="polite"></section>
        </div>
      </section>
    </main>

    <script src="./js/inventory.js"></script>
    <script src="./js/search.js"></script>
  </body>
</html>
