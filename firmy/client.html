<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Klienta - Rozliczenie</title>
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container stack">
      <section class="card stack">
        <div class="toolbar">
          <h1 id="clientName">Panel Klienta</h1>
          <button id="logoutBtn" class="secondary" type="button">Wyloguj</button>
        </div>
        <p>Tylko podgląd danych rozliczeniowych.</p>
        <div id="status" class="status"></div>
      </section>

      <section class="card stack">
        <label>Miesiąc
          <input id="currentMonth" type="month" />
        </label>

        <div class="grid-3">
          <div class="kpi"><span>Wydatki z Twojego konta</span><b id="kpiClientSpend">0 zł</b></div>
          <div class="kpi"><span>Wydatki z konta właściciela</span><b id="kpiOwnerSpend">0 zł</b></div>
          <div class="kpi"><span>Opłata za pracę</span><b id="kpiWorkFee">0 zł</b></div>
          <div class="kpi"><span>Do zapłaty</span><b id="kpiToPay">0 zł</b></div>
          <div class="kpi"><span>Status płatności</span><b id="kpiPaymentStatus">-</b></div>
        </div>

        <p><b>Uwagi:</b> <span id="monthNote">-</span></p>
      </section>

      <section class="card stack">
        <h2>Szczegóły kosztów</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Opis</th>
                <th>Kategoria</th>
                <th>Płatnik</th>
                <th>Kwota</th>
                <th>Notatka</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="./client.js"></script>
  </body>
</html>
